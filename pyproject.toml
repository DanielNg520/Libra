[project]
name = "libra"
version = "0.1.0"
description = "Academic librarian: lecture transcripts, readings, maps and search for agents."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# Fedora instance: transcript fetch, Whisper, Gemini page reads, reading export.
fedora = [
    "httpx>=0.28",
    "pillow>=12.3",
    # Same pin as the SemAI tool env, so the installed chromium-1248 is shared.
    "playwright==1.64.1",
    "faster-whisper>=1.2.1",
    "numpy>=2.0",
]

[project.scripts]
libra = "libra.cli:main"

[dependency-groups]
dev = ["pytest>=9.1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/libra"]

[tool.pytest.ini_options]
testpaths = ["tests"]
